spring:
  application:
    name: codemind-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

  datasource:
    use-env-url: ${USE_ENV_DATABASE_URL:true}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:codemind_db}
    username: ${DB_USER:codemind_user}
    password: ${DB_PASSWORD:codemind_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

codemind:
  sandbox:
    root: ${CODEMIND_SANDBOX_ROOT:./codemind-sandbox}
    max-archive-size-bytes: ${CODEMIND_MAX_ARCHIVE_SIZE:104857600} # 100 MB
    max-extracted-size-bytes: ${CODEMIND_MAX_EXTRACTED_SIZE:524288000} # 500 MB
    max-file-count: ${CODEMIND_MAX_FILE_COUNT:20000}
    max-directory-count: ${CODEMIND_MAX_DIRECTORY_COUNT:5000}
    max-single-file-size-bytes: ${CODEMIND_MAX_SINGLE_FILE_SIZE:104857600} # 100 MB
    max-path-length: ${CODEMIND_MAX_PATH_LENGTH:500}
    max-filename-length: ${CODEMIND_MAX_FILENAME_LENGTH:255}
    max-tree-depth: ${CODEMIND_MAX_TREE_DEPTH:20}
    max-tree-nodes: ${CODEMIND_MAX_TREE_NODES:10000}
    max-content-read-bytes: ${CODEMIND_MAX_CONTENT_READ_BYTES:1048576} # 1 MB
  security:
    jwt:
      secret: ${JWT_SECRET:c3VwZXJfc2VjcmV0X2tleV9mb3JfZGV2ZWxvcG1lbnRfb25seV9kb19ub3RfdXNlX2luX3Byb2RfdW5sZXNzX292ZXJyaWRkZW5fYnlfZW52}
      expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  llm:
    provider: ${LLM_PROVIDER:GEMINI}
    api-key: ${CODEMIND_LLM_API_KEY:${LLM_API_KEY:placeholder_api_key}}
    model: ${LLM_MODEL:gemini-flash-lite-latest}
    temperature: ${LLM_TEMPERATURE:0.1}
    max-tokens: ${LLM_MAX_TOKENS:2048}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:45}
    rate-limit-per-user-per-minute: ${LLM_RATE_LIMIT_USER:10}
    rate-limit-per-repo-per-minute: ${LLM_RATE_LIMIT_REPO:20}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-NONE}] %-5level %logger{36} - %msg%n"
  level:
    com.codemind: INFO
    org.springframework.security: WARN
