# Local Development Fallback Profile (H2 in PostgreSQL mode for zero-dependency local startup)
spring:
  datasource:
    use-env-url: ${USE_ENV_DATABASE_URL:false}
    url: jdbc:h2:mem:codemind_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
