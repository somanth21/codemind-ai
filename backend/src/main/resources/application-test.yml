spring:
  datasource:
    use-env-url: false
    url: jdbc:h2:mem:codemind_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

codemind:
  security:
    jwt:
      secret: dGVzdF9qd3Rfc2VjcmV0X2tleV9mb3JfdW5pdF9hbmRfaW50ZWdyYXRpb25fdGVzdHNfYXRfbGVhc3RfMjU2X2JpdHM=
      expiration-ms: 3600000
  llm:
    provider: MOCK
