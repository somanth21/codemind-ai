# ==============================================================================
# CodeMind AI - Render Blueprint (Infrastructure-as-Code)
# https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # CodeMind AI Unified Web Service (Backend Engine + Frontend Embedded)
  # ----------------------------------------------------------------------------
  - type: web
    name: codemind-ai
    env: docker
    dockerfilePath: Dockerfile
    plan: standard
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: codemind-postgres
          property: connectionString
      - key: USE_ENV_DATABASE_URL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CODEMIND_LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: CODEMIND_ADMIN_EMAIL
        value: admin@codemind.ai
      - key: CODEMIND_ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

databases:
  # ----------------------------------------------------------------------------
  # Managed PostgreSQL Database
  # ----------------------------------------------------------------------------
  - name: codemind-postgres
    databaseName: codemind_db
    user: codemind_user
    plan: standard
    postgresMajorVersion: 16
