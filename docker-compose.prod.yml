# ==============================================================================
# CodeMind AI - Production Hardened Docker Compose
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# ==============================================================================

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codemind-backend-prod
    restart: always
    env_file:
      - .env.production
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - codemind-sandbox-prod:/app/codemind-sandbox
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M
        reservations:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - codemind-prod-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codemind-frontend-prod
    restart: always
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.20'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - codemind-prod-net

volumes:
  codemind-sandbox-prod:
    name: codemind-sandbox-prod

networks:
  codemind-prod-net:
    name: codemind-prod-net
    driver: bridge
